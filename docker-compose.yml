services:
  camnas:
    build: ./app
    image: camnas:latest
    container_name: camnas
    restart: unless-stopped
    ports:
      - "8090:8080" # mở http://<IP-NAS>:8090
    environment:
      TZ: Asia/Ho_Chi_Minh
      ADMIN_PASSWORD: admin # mật khẩu đăng nhập lần đầu - đổi lại trong trang Cài đặt
      DATA_DIR: /camnas/data # = thư mục data/ trong thư mục dự án, CamNAS tự tạo
      RECORDINGS_DIR: /volume1/Docker_Run/CameraRecord/recording # chỗ lưu bản ghi ban đầu - đổi được trong Cài đặt
    volumes:
      # Chỉ gắn các thư mục luôn có sẵn, nên Synology không báo lỗi "Bind mount failed".
      - .:/camnas # thư mục dự án (chứa data/: cấu hình camera, nhật ký)
      - /volume1:/volume1 # để chọn và tự tạo thư mục lưu bản ghi ngay trong giao diện
      # - /volume2:/volume2 # bỏ dấu # ở đầu dòng nếu muốn lưu sang volume khác
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
