name: Release

# Phát hành bản mới:
#   1. sửa __version__ trong app/nvr/__init__.py (ví dụ "1.4.0") và commit
#   2. git tag v1.4.0 && git push origin v1.4.0
# Tag có hậu tố (v1.4.0-rc1) sẽ thành bản thử nghiệm (pre-release) và không gắn tag "latest".
# Kết quả: image ghcr.io/<owner>/camnas (amd64 + arm64) và các file .spk đính kèm vào GitHub Release.
# Các file .spk cũng được đẩy lên cùng package với tag <phiên bản>-spk: CamNAS đọc bản mới từ đó
# (package trên ghcr.io phải để Public; kho mã thì để riêng tư cũng được).
# Thứ tự: đẩy <phiên bản>-spk trước rồi mới tới image, để trang package trên GitHub hiện image là
# bản mới nhất. CamNAS chỉ báo bản mới khi đã có cả image lẫn <phiên bản>-spk nên đẩy trước vẫn an toàn.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app/nvr/__init__.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            "$VERSION"|"$VERSION"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $VERSION"; exit 1 ;;
          esac
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/camnas" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$VERSION" ]; then echo "prerelease=false" >> "$GITHUB_OUTPUT"; else echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build .spk packages
        run: |
          python3 spk/build.py --image "${{ steps.meta.outputs.image }}" --image-tag "${{ steps.meta.outputs.tag }}" --build "${{ github.run_number }}"
          python3 spk/build.py --build "${{ github.run_number }}"
          ls -l dist

      - uses: oras-project/setup-oras@v1

      - name: Publish .spk packages next to the image (in-app updates read them from here)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd dist
          oras push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-spk" \
            --artifact-type application/vnd.camnas.spk.v1 \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            *.spk

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prerelease == 'false' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=CamNAS - free 24/7 camera recorder for Synology NAS
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          # image nhiều nền tảng: trang package trên GitHub đọc mô tả ở danh mục (index), không đọc label
          annotations: |
            index:org.opencontainers.image.description=CamNAS - free self-hosted 24/7 recorder (NVR) for IP cameras on Synology NAS. Records RTSP cameras straight to the NAS disks; live view; timeline playback and clip export in the browser; no per-camera licenses. Installs as a DSM package (.spk) with updates through Package Center. English / Tiếng Việt. Not affiliated with Synology Inc.
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            index:org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          ## Install on Synology (DSM 7.2.1 or later, Container Manager installed)

          1. **Package Center → Settings → General → Trust Level → Any publisher**
          2. **Package Center → Manual Install**, choose the \`.spk\` file below
          3. Open **CamNAS** from the DSM main menu (or http://NAS-IP:8090). First password: \`admin\`

          | File | |
          |---|---|
          | \`CamNAS-*-NNNN.spk\` | Downloads the prebuilt image - fast, recommended |
          | \`CamNAS-*-build-on-nas.spk\` | Builds the image on the NAS (takes a few minutes) |

          Recordings are stored in the shared folder **camnas** by default (change it in Settings).
          One-click updates: add the package source \`http://127.0.0.1:8090/pkgsrc\` once in **Package Center → Settings → Package Sources** (CamNAS 1.4.0 or later), then use the **Update** button.
          Remote access: in Web Station create a package service portal for **CamNAS** (port-based, HTTPS 8443), forward TCP 8443 on your router and open https://your-domain:8443. Never forward the HTTP port 8090. Details: [Remote access](https://github.com/$GITHUB_REPOSITORY#remote-access)
          Docker image: \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)

          Hướng dẫn tiếng Việt: [README.vi.md](https://github.com/$GITHUB_REPOSITORY/blob/main/README.vi.md#cài-bằng-gói-spk-khuyên-dùng)
          EOF
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.spk --title "CamNAS $TAG" --notes-file notes.md $FLAGS
